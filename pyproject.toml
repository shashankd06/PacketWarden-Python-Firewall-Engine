[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packetwarden"
version = "0.1.0"
description = "Offline PCAP analysis, stateful rule engine, and network attack detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
]

[project.scripts]
packetwarden = "packetwarden.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
